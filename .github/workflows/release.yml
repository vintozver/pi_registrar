name: Release Packages

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Compute version
        id: version
        run: echo "version=0+github$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [client, server]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate changelog entry
        working-directory: ${{ matrix.package }}
        env:
          DEBFULLNAME: GitHub Actions
          DEBEMAIL: actions@github.com
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends devscripts
          debchange \
            --create \
            --package pi-registrar-${{ matrix.package }} \
            --force-bad-version \
            --newversion "${{ needs.version.outputs.version }}-1" \
            --distribution unstable \
            --controlmaint \
            --changelog debian/changelog \
            "Automated release build from ${{ github.sha }}"

      - name: Build ${{ matrix.package }} package
        uses: jtdor/build-deb-action@v1
        env:
          DEB_BUILD_OPTIONS: noautodbgsym
        with:
          source-dir: ${{ matrix.package }}
          buildpackage-opts: --build=binary --no-sign

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-registrar-${{ matrix.package }}-${{ needs.version.outputs.version }}
          path: debian/artifacts/
          if-no-files-found: error

  build-arch:
    needs: version
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        package: [client, server]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git python python-build python-cherrypy python-cryptography \
            python-dateutil python-dnspython python-installer python-pyjwt \
            python-setuptools python-wheel python-yaml

      - name: Build ${{ matrix.package }} package
        working-directory: ${{ matrix.package }}/arch
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          sed -i "s/^pkgver=.*/pkgver=${PACKAGE_VERSION}/" PKGBUILD
          sed -i "s/^_commit=.*/_commit=${GITHUB_SHA}/" PKGBUILD
          useradd --create-home builder
          chown -R builder .
          runuser -u builder -- makepkg --cleanbuild --clean --noconfirm

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-registrar-${{ matrix.package }}-arch-${{ needs.version.outputs.version }}
          path: ${{ matrix.package }}/arch/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    needs:
      - version
      - build
      - build-arch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: packages-${{ needs.version.outputs.version }}
          RELEASE_TITLE: Packages ${{ needs.version.outputs.version }}
        run: |
          shopt -s globstar nullglob
          packages=(dist/**/*.deb dist/**/*.pkg.tar.zst)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No packages were downloaded." >&2
            exit 1
          fi

          gh release create "$TAG_NAME" "${packages[@]}" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "Automated Debian and Arch Linux package release for $GITHUB_SHA."
