[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pi_registrar.server"
version = "1.0.0"
description = "pi_registrar address registration server"
requires-python = ">=3.9"
dependencies = [
    "cherrypy",
    "cryptography>=49.0.0",
    "dnspython",
    "PyJWT>=2.12.0",
    "PyYAML",
    "python-dateutil",
]

[project.scripts]
pi_registrar_server = "pi_registrar.server:run"

[tool.setuptools]
packages = ["pi_registrar.server"]
package-dir."pi_registrar.server" = "src"
