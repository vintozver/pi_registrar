[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pi_registrar.client"
version = "1.0.0"
description = "pi_registrar address registration client"
requires-python = ">=3.8"
dependencies = [
    "cryptography>=49.0.0",
    "PyJWT>=2.12.0",
]

[project.scripts]
pi_registrar_client = "pi_registrar.client:main"

[tool.setuptools]
packages = ["pi_registrar.client"]
package-dir."pi_registrar.client" = "src"
